# Dependabot — automated dependency update PRs.
# Runs on GitHub's infrastructure; does NOT consume GitHub Actions minutes
# (this repo intentionally has no Actions workflows). CodeRabbit reviews each PR.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/KanbanFlow"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Bundle low-risk minor/patch bumps into a single PR to cut review noise.
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/tests/KanbanFlow.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      nuget-tests-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NOTE: three manifests are covered above — app (nuget, /src/KanbanFlow), test
  # project (nuget, /tests/KanbanFlow.Tests) and scripts/e2e tooling (npm, /).
  # Client-side libs (Bootstrap, SortableJS) are the one exception: they are
  # vendored under wwwroot/lib and are NOT covered by Dependabot. They are
  # managed via libman.json — run `libman update` to bump them. See issue #136.
