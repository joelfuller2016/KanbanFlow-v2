name: "Bug"
description: "Something doesn't work as expected"
labels: ["bug"]
title: "P_: "
body:
  - type: markdown
    attributes:
      value: "Replace the `P_` in the title with the priority (e.g. `P1:`)."
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or screenshots.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, browser (if UI), commit SHA.
    validations:
      required: false
