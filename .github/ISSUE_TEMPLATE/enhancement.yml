name: "Enhancement / Feature"
description: "Propose a new capability or improvement"
labels: ["enhancement"]
title: "P_: "
body:
  - type: markdown
    attributes:
      value: "Replace the `P_` in the title with the priority (e.g. `P1:` or `P2:`)."
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P1 (should have)", "P2 (nice to have)"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["ui", "api", "ai-agent", "tech-debt", "docs", "other"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's missing or painful today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed scope
      description: What should change? Files, endpoints, components, behavior. Note anything explicitly OUT of scope.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Cite the current code — `file:line @ <commit>` — proving the gap / current behavior."
      placeholder: "src/KanbanFlow/ApiEndpoints.cs:297 @ 0f65117 — signature has no `actor` param …"
    validations:
      required: true
  - type: textarea
    id: fix-plan
    attributes:
      label: Fix plan (HOW)
      description: Numbered, concrete steps naming the files/methods to change.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific, binary checks that prove this is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Real tests that prove it — xUnit and/or smoke-api.ps1. No fakes.
      placeholder: |
        - xUnit: …
        - smoke-api.ps1: …
    validations:
      required: true
  - type: checkboxes
    id: analysis
    attributes:
      label: Analysis done (see docs/issue-quality-checklist.md)
      options:
        - label: Read the actual code; evidence cites file:line @ commit
          required: true
        - label: Verified repo conventions (EnsureXxx not EF migrations; no GitHub Actions; audit trail; no fake tests)
          required: true
        - label: Searched existing issues/PRs for duplicates / conflicts and linked them
          required: true
